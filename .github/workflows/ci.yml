name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goflags: ""
          - os: windows-latest
            goflags: ""
          - os: ubuntu-latest
            goflags: -tags=netcgo
    env:
      GOFLAGS: ${{ matrix.goflags }}
      GODEBUG: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Linux native resolver build conditions
        if: runner.os == 'Linux'
        shell: bash
        run: test "$(go env CGO_ENABLED)" = "1"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Smoke test Phase 0 platform probes
        run: |
          go run ./cmd/reachrun family-conditions
          go run ./cmd/reachrun resolve localhost
          go run ./cmd/reachrun resolver-inventory
